site_name: Unity Training Hub
site_description: Hệ thống Đào tạo & Tối ưu hóa Unity
docs_dir: 'src'       # Nơi chứa file Markdown gốc
site_dir: 'docs'      # Nơi xuất file HTML tĩnh ra để đẩy lên GitHub

# Bắt buộc: giữ URL dạng file phẳng để đường dẫn ảnh "../assets/..."
# trong các thẻ <img> HTML thô resolve đúng (MkDocs không rewrite raw HTML).
use_directory_urls: false

theme:
  name: material
  language: vi
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Chuyển sang Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Chuyển sang Light mode

extra_css:
  - stylesheets/custom.css

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.details
  - admonition
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - 🏠 Trang chủ: index.md
  - 🌱 1. Fresher:
      - Module 1 — Ultimate Guide to Profiling: 01-fresher/01-ultimate-guide-to-profiling.md
  - 🚀 2. Junior: []
  - ⚔️ 3. Senior: []
  - 👑 4. Tech Lead: []