site_name: Unity Training Hub
site_description: Hệ thống Đào tạo & Tối ưu hóa Unity
docs_dir: 'src'       # Nơi chứa file Markdown gốc
site_dir: 'docs'      # Nơi xuất file HTML tĩnh ra để đẩy lên GitHub

# Bắt buộc: giữ URL dạng file phẳng để đường dẫn ảnh "../assets/..."
# trong các thẻ <img> HTML thô resolve đúng (MkDocs không rewrite raw HTML).
use_directory_urls: false

theme:
  name: material
  language: vi
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Chuyển sang Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Chuyển sang Light mode

extra_css:
  - stylesheets/custom.css

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.details
  - admonition
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - 🏠 Trang chủ: index.md
  - 📋 Bảng kiểm nguồn dữ liệu: 00-nguon-du-lieu.md
  - 🌱 1. Fresher:
      - Module 1 — Ultimate Guide to Profiling: 01-fresher/01-ultimate-guide-to-profiling.md
  - 🚀 2. Junior:
      - Module 2 — UI & Physics Deep Dive: 02-junior/01-ui-physics-deep-dive.md
  - ⚔️ 3. Senior:
      - Module 3 — Memory, Addressables & Networking: 03-senior/01-memory-addressables-networking.md
  - 👑 4. Tech Lead:
      - Module 4 — GPU, URP & Advanced Rendering: 04-tech-lead/01-gpu-urp-advanced-rendering.md
      - Module 5 — CyberAgent Bible & Sentry ANR: 05-tech-lead/01-cyberagent-bible-anr.md